name: CI

on: [push, pull_request, workflow_dispatch]

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: "test / ${{ matrix.os }} / py${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.12"]
    steps:
      - name: "checkout"
        uses: actions/checkout@v7

      - name: "setup python ${{ matrix.python }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: "install (README path)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 合成 fixture 仓库本体是生成物、不入仓（`.gitignore` 排除 `**/repo/`），
      # 干净 clone 里没有它们。**必须先生成**，否则依赖仓库的测试与 CLI 冒烟全挂。
      # 这一步也顺带断言"生成器在 CI 的 git 版本上能重建同一批仓库"。
      - name: "generate synthetic fixtures"
        run: python tools/gen_fixtures.py --out data/fixtures

      - name: "pytest"
        run: python -m pytest -q

      - name: "CLI smoke (console script)"
        run: |
          mergefidelity --version
          mergefidelity --help

      - name: "CLI smoke (module form)"
        run: python -m mergefidelity --version

      - name: "CLI smoke (fidelity on generated fixtures)"
        shell: bash
        run: |
          set +e
          mergefidelity fidelity scan data/fixtures/fidelity/smuggle-extra-line/repo --fail-on=smuggled > /dev/null
          code=$?
          set -e
          test "$code" = "1"

      - name: "CLI smoke (parity on generated fixtures)"
        shell: bash
        run: |
          set +e
          mergefidelity parity data/fixtures/parity/bidirectional-basic/repo \
            --from=release/1.0 --to=main > parity-report.json
          code=$?
          set -e
          test "$code" = "0"
          python -c "import json;d=json.load(open('parity-report.json'));assert d['candidates']==4 and d['present']==1 and d['missing']==2 and d['modified']==1, d"

      - name: "CLI smoke (ledger on generated fixtures)"
        shell: bash
        run: |
          set +e
          mergefidelity ledger data/fixtures/ledger/then-redone/repo > ledger-report.json
          code=$?
          set -e
          test "$code" = "0"
          python -c "import json;d=json.load(open('ledger-report.json'));assert d['counts']=={'no_successor':0,'then_redone':1,'unverified':0}, d"

      - name: "CLI smoke (report digest + --verify on generated fixtures)"
        shell: bash
        run: |
          set +e
          mergefidelity report data/fixtures/fidelity/smuggle-extra-line/repo \
            --out report-out.json
          code=$?
          set -e
          test "$code" = "0"
          mergefidelity report data/fixtures/fidelity/smuggle-extra-line/repo \
            --verify report-out.json > verified.txt
          grep -q "verified:" verified.txt
          python -c "import json;d=json.load(open('report-out.json'));assert d['parity'] is None and 'parity_not_requested' in d['notes'], d"

      - name: "CLI smoke (gate four exit-code semantics)"
        shell: bash
        run: |
          set +e
          mergefidelity gate data/fixtures/fidelity/smuggle-extra-line/repo \
            --baseline audit-baseline.toml > gate-report.json
          code=$?
          set -e
          test "$code" = "0"
          python -c "import json;d=json.load(open('gate-report.json'));assert d['counts']=={'baselined':1,'expired':0,'new':0,'stale':0}, d"
          # 把 expires 改到过去 → 退出码 1 且 expired=1
          sed 's/2099-12-31/2000-01-01/' audit-baseline.toml > expired-baseline.toml
          set +e
          mergefidelity gate data/fixtures/fidelity/smuggle-extra-line/repo \
            --baseline expired-baseline.toml > /dev/null
          code=$?
          set -e
          test "$code" = "1"
          # 坏基线（数组形态）→ 退出码 2 + 行号
          printf '[[finding]]\nid = "x"\nexpires = ["2099-12-31"]\njustification = "j"\n' > bad-baseline.toml
          set +e
          mergefidelity gate data/fixtures/fidelity/smuggle-extra-line/repo \
            --baseline bad-baseline.toml 2> bad-baseline.err
          code=$?
          set -e
          test "$code" = "2"
          grep -q "toml_unsupported" bad-baseline.err
