name: CI

on: [push, pull_request, workflow_dispatch]

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: "test / ${{ matrix.os }} / py${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - name: "checkout"
        uses: actions/checkout@v4

      - name: "setup python ${{ matrix.python }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: "install (README path)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: "pytest"
        run: python -m pytest -q

      - name: "CLI smoke (console script)"
        run: |
          mergefidelity --version
          mergefidelity --help

      - name: "CLI smoke (module form)"
        run: python -m mergefidelity --version

      - name: "CLI smoke (fidelity on generated fixtures)"
        shell: bash
        run: |
          set +e
          mergefidelity fidelity scan data/fixtures/fidelity/smuggle-extra-line/repo --fail-on=smuggled > /dev/null
          code=$?
          set -e
          test "$code" = "1"
