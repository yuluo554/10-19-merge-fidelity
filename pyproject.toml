[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mergefidelity"
version = "0.2.0"
description = "Merge 保真度审计：用 git 自己的合并引擎复算机械合并，逐 blob 对比实际记录的树"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "yuluo554", email = "282769740+yuluo554@users.noreply.github.com" }]
keywords = ["git", "merge", "audit", "evil-merge", "backport", "reproducible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7,<9", "pyyaml>=6"]

[project.scripts]
mergefidelity = "mergefidelity.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/merge-fidelity"
Issues = "https://github.com/yuluo554/merge-fidelity/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 需要真实生成合成仓库的测试（重生成 21 个仓库并与冻结产物逐字节比对）",
]
filterwarnings = ["error::DeprecationWarning:mergefidelity.*"]
